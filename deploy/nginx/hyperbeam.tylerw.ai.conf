# HyperBEAM node on hyperbeam.tylerw.ai -> localhost:10000
# TLS block (443) is added by certbot --nginx after issuance.
server {
    server_name hyperbeam.tylerw.ai;

    # HyperBEAM responses can carry large signed-header metadata; bump buffers.
    proxy_buffer_size       128k;
    proxy_buffers           8 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size    100m;

    # Bare root misses the AO process lookup (404); bounce browsers to landing.
    location = / {
        return 302 /~hyperbuddy@1.0/index;
    }

    location / {
        proxy_pass http://localhost:10000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 300;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hyperbeam.tylerw.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hyperbeam.tylerw.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = hyperbeam.tylerw.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hyperbeam.tylerw.ai;
    return 404; # managed by Certbot


}